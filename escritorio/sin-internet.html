<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>La Campiña · Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 "Segoe UI", system-ui, sans-serif; background: #f4f2ee; color: #1d1d1b; }
    main { background: #fff; padding: 2rem 2.25rem; border-radius: 8px; max-width: 30rem; box-shadow: 0 16px 30px -18px rgba(0,0,0,.3); }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 0 1rem; color: #555; }
    button { font: inherit; font-weight: 600; padding: .7em 1.4em; border: 0; border-radius: 6px; background: #1d1d1b; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>No se pudo abrir el panel</h1>
    <p>Parece que no hay internet. La primera vez el programa necesita conexión; después ya abre aunque no haya.</p>
    <p id="auto">Se vuelve a intentar solo en <b id="seg">15</b> segundos.</p>
    <button type="button" id="otra">Intentar otra vez</button>
  </main>
  <script>
    const url = new URLSearchParams(location.search).get("url");
    const ir = () => { if (url && url.startsWith("https://")) location.href = url; };
    document.getElementById("otra").addEventListener("click", ir);
    let s = 15;
    setInterval(() => { s -= 1; document.getElementById("seg").textContent = Math.max(0, s); if (s <= 0) { s = 15; if (navigator.onLine) ir(); } }, 1000);
  </script>
</body>
</html>
